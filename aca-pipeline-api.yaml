trigger:
  branches:
    include:
      - docker-container-testing

variables:
- group: bookshelf-api-secrets-aca

pool:
  vmImage: ubuntu-latest

stages:

# ==========================
# Build & Push Image
# ==========================
- stage: Build
  displayName: Build and Push Image

  jobs:
  - job: Build

    steps:

      - task: Docker@2
        displayName: Build and Push Web Image
        inputs:
          command: buildAndPush
          repository: bookshelf-api
          dockerfile: 'Dockerfile'
          containerRegistry: 'vn-sc-acr-bookshelf'
          tags: |
            latest
            $(Build.BuildId)

# ==========================
# Run ACA Migration Job
# ==========================
- stage: Migrate
  displayName: Run ACA Migration Job

  dependsOn: Build

  jobs:
  - job: RunMigration

    steps:

    - task: AzureCLI@2
      displayName: Start Migration Job

      inputs:
        azureSubscription: 'Book-App-Connection'
        scriptType: pscore
        scriptLocation: inlineScript

        inlineScript: |

          az containerapp job start `
            --name bookshelf-db-migration `
            --resource-group rg-bookshelf-aca-dev
# ==========================
# Deploy ACA
# ==========================
- stage: Deploy
  displayName: Deploy to ACA

  dependsOn: Build

  jobs:
  - job: Deploy

    steps:

    - task: AzureCLI@2
      displayName: Deploy API ACA

      inputs:
        azureSubscription: 'Book-App-Connection'
        scriptType: pscore
        scriptLocation: inlineScript

        inlineScript: |
          az containerapp update `
            --name bookshelf-api-app `
            --resource-group rg-bookshelf-aca-dev `
            --image bookshelfacr2026.azurecr.io/bookshelf-api:$(Build.BuildId)