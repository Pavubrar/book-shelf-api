parameters:

- name: projectFile
  type: string

- name: buildConfiguration
  type: string
  default: 'Release'

- name: artifactName
  type: string
  default: 'drop'

steps:

- checkout: self
  clean: true

- script: |
    echo "===== DEBUG INFO ====="
    echo "Working Directory:"
    pwd
    echo "List root:"
    ls -la
    echo "Find csproj:"
    find . -name "*.csproj"
  displayName: 'DEBUG: locate csproj'

- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '9.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore packages'
  inputs:
    command: 'restore'
    projects: ${{ parameters.projectFile }}

- task: DotNetCoreCLI@2
  displayName: 'Build project'
  inputs:
    command: 'build'
    projects: ${{ parameters.projectFile }}
    arguments: '--configuration ${{ parameters.buildConfiguration }}'

- task: DotNetCoreCLI@2
  displayName: 'Publish project'
  inputs:
    command: 'publish'
    projects: ${{ parameters.projectFile }}
    publishWebProjects: false
    arguments: '--configuration ${{ parameters.buildConfiguration }} --output $(Build.ArtifactStagingDirectory)/publish'
    zipAfterPublish: false

- script: |
    set -e
    echo "===== DEBUG: publish output ====="
    ls -la "$(Build.ArtifactStagingDirectory)/publish"
  displayName: 'DEBUG: verify publish output'

- task: ArchiveFiles@2
  displayName: 'Archive publish folder'
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
    replaceExistingArchive: true

- script: |
    set -e
    echo "===== DEBUG: artifact staging ====="
    ls -la "$(Build.ArtifactStagingDirectory)"
    find "$(Build.ArtifactStagingDirectory)" -maxdepth 2 -name "*.zip"
  displayName: 'DEBUG: verify zip output'

- task: PublishBuildArtifacts@1
  displayName: 'Publish build artifact'
  inputs:
    pathToPublish: '$(Build.ArtifactStagingDirectory)'
    artifactName: ${{ parameters.artifactName }}







