apiVersion: apps/v1
kind: Deployment

metadata:
  name: bookshelf-api
  namespace: bookshelf

spec:
  replicas: 1

  selector:
    matchLabels:
      app: bookshelf-api

  template:
    metadata:
      labels:
        app: bookshelf-api
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: bookshelf-api-sa
      containers:
        - name: bookshelf-api
          image: bookshelfacr2026.azurecr.io/bookshelf-api:v11
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"

          envFrom:
            - configMapRef:
                name: bookshelf-api-config
            - secretRef:
                name: bookshelf-api-secret
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/db
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3 
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12     